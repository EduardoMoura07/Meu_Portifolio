name: Deploy Portfólio - Eduardo Moura

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys simultâneos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Verificar estrutura do projeto
      - name: Verificar arquivos do portfólio
        run: |
          echo "======================================"
          echo " VERIFICANDO PROJETO"
          echo "======================================"

          echo ""
          echo "Arquivos na raiz:"
          ls -la

          echo ""

          if [ -f "index.html" ]; then
            echo "✅ index.html encontrado"
          else
            echo "❌ ERRO: index.html não encontrado!"
            exit 1
          fi

          if [ -f "style.css" ]; then
            echo "✅ style.css encontrado"
          else
            echo "⚠️ AVISO: style.css não encontrado"
          fi

          if [ -f "script.js" ]; then
            echo "✅ script.js encontrado"
          else
            echo "⚠️ AVISO: script.js não encontrado"
          fi

          if [ -f "curriculo.pdf" ]; then
            echo "✅ curriculo.pdf encontrado"
          else
            echo "⚠️ AVISO: curriculo.pdf não encontrado"
          fi

          if [ -d "imagens" ]; then
            echo "✅ Pasta imagens encontrada"
            echo ""
            echo "Arquivos de imagens:"
            ls -la imagens/
          else
            echo "⚠️ AVISO: pasta imagens não encontrada"
          fi

          echo ""
          echo "======================================"
          echo " VERIFICAÇÃO CONCLUÍDA"
          echo "======================================"

      # 3. Configurar GitHub Pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # 4. Criar pacote do site
      - name: Fazer upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      # 5. Publicar no GitHub Pages
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4